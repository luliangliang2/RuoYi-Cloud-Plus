apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ruoyi-database
    app.kubernetes.io/name: trace
    app.kubernetes.io/version: v1
    version: v1
  name: ruoyi-database-v1
  namespace: trace-system  #工作负载部署到 kubesphere 项目名称
  annotations:
    deployment.kubernetes.io/revision: '1'
    kubesphere.io/creator: lishuyan
    servicemesh.kubesphere.io/enabled: 'true'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-database
      app.kubernetes.io/version: v1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ruoyi-database
        app.kubernetes.io/name: trace
        app.kubernetes.io/version: v1
        version: v1
      annotations:
        cni.projectcalico.org/ipv4pools: '["default-ipv4-ippool"]'
        kubesphere.io/collectSavedLog: 'true'
        sidecar.istio.io/inject: 'true'
    spec:
      imagePullSecrets: #镜像仓库密钥
        - name: harbor
      containers:
        - name: ruoyi-database
          image: $REGISTRY/$HARBOR_NAMESPACE/ruoyi-database:v$BUILD_NUMBER
          imagePullPolicy: Always
          ports:
            - name: tcp-9205
              protocol: TCP
              containerPort: 9205
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ruoyi-database
    app.kubernetes.io/name: trace
    app.kubernetes.io/version: v1
    version: v1
  annotations:
    kubesphere.io/creator: lishuyan
    kubesphere.io/serviceType: statelessservice
    servicemesh.kubesphere.io/enabled: 'true'
  name: ruoyi-database
  namespace: trace-system #服务部署到 kubesphere 项目名称
spec:
  ports: #服务端口
    - name: http-9205
      protocol: TCP
      port: 9205
      targetPort: 9205
  selector:
    app: ruoyi-database
    app.kubernetes.io/name: trace
    app.kubernetes.io/version: v1
  sessionAffinity: None
  type: NodePort
