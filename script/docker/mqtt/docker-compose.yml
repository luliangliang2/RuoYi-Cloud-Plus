version: "3.8"

services:
  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    restart: always
    environment:
      - EMQX_NODE__name=emqx@127.0.0.1
      - EMQX_DASHBOARD__default_username=admin
      - EMQX_DASHBOARD__default_password=Abc123456
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8883:8883"
      - "18083:18083"
    volumes:
      - emqx_data:/var/lib/emqx
      - emqx_log:/var/log/emqx

volumes:
  emqx_data:
  emqx_log: