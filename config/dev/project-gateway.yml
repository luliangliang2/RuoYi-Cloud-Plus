# 安全配置
security:
  # 验证码
  captcha:
    # 是否开启验证码
    enabled: true
    # 验证码类型 math 数组计算 char 字符验证
    type: MATH
    # line 线段干扰 circle 圆圈干扰 shear 扭曲干扰
    category: CIRCLE
    # 数字验证码位数
    numberLength: 1
    # 字符验证码长度
    charLength: 4
  # 防止XSS攻击
  xss:
    enabled: true
    excludeUrls:
      - /system/notice
  # 不校验白名单
  ignore:
    whites:
      - /code
      - /auth/logout
      - /auth/login
      - /auth/smsLogin
      - /auth/xcxLogin
      - /auth/register
      - /resource/sms/code
      - /*/v2/api-docs
      - /csrf

spring:
  cloud:
    # 网关配置
    gateway:
      discovery:
        locator:
          lowerCaseServiceId: true
          enabled: true
      routes:
        # 认证中心
        - id: project-auth
          uri: lb://project-auth
          predicates:
            - Path=/auth/**
          filters:
            # 验证码处理
            - CacheRequestFilter
            - ValidateCodeFilter
            - StripPrefix=1
        # 代码生成
        - id: project-gen
          uri: lb://project-gen
          predicates:
            - Path=/code/**
          filters:
            - StripPrefix=1
        # 系统模块
        - id: project-system
          uri: lb://project-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        # 资源服务
        - id: project-resource
          uri: lb://project-resource
          predicates:
            - Path=/resource/**
          filters:
            - StripPrefix=1
        # 用户管理模块
        - id: project-admin
          uri: lb://project-admin
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
        # 商品订单模块
        - id: project-commodity
          uri: lb://project-commodity
          predicates:
            - Path=/commodity/**
          filters:
            - StripPrefix=1
        # 动态服务模块
        - id: project-dynamic
          uri: lb://project-dynamic
          predicates:
            - Path=/dynamic/**
          filters:
            - StripPrefix=1

    # sentinel 配置
    sentinel:
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: ${spring.cloud.nacos.server-addr}
            dataId: sentinel-${spring.application.name}.json
            groupId: ${spring.cloud.nacos.config.group}
            namespace: ${spring.profiles.active}
            data-type: json
            rule-type: flow
